plugins {
    id 'com.android.application'
}

android {
    namespace 'app.autospiegel'
    compileSdk 35

    defaultConfig {
        applicationId 'app.autospiegel'
        // Old head units often still run Android 4.x, so keep this low.
        minSdk 16
        targetSdk 35
        versionCode 4
        versionName '2.0'
    }

    signingConfigs {
        // Not a secret: a fixed key so that every build can update an installed copy.
        shared {
            storeFile rootProject.file('signing/autospiegel.keystore')
            storePassword 'autospiegel'
            keyAlias 'autospiegel'
            keyPassword 'autospiegel'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // The real org.json, instead of Android's stubs, for unit tests.
    testImplementation 'org.json:json:20240303'
    // Renders the radio screens to PNG files without a device.
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
